name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de code op uit de repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. AUTOMATISCH UITPAKKEN VAN HET ZIP-BESTAND
      - name: Unzip webapp in assets
        run: |
          cd app/src/main/assets
          if [ -f webapp.zip ]; then
            unzip -o webapp.zip
            rm webapp.zip
            echo "ZIP-bestand succesvol uitgepakt!"
          else
            echo "Geen webapp.zip gevonden, overslaan..."
          fi

      # 3. Stel Java (JDK) in
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 4. Maak gradlew uitvoerbaar
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Bouw de APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Upload de gegenereerde APK als Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
